<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⭐ Seema Digital | Google Review</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
background:linear-gradient(-45deg,#4285F4,#34A853,#FBBC05,#EA4335);
background-size:400% 400%;
animation:bg 12s ease infinite;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:0 50%}
50%{background-position:100% 50%}
100%{background-position:0 50%}
}

.loader{
position:fixed;
inset:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
font-size:28px;
z-index:9999;
transition:.5s;
}

.card{

width:100%;
max-width:430px;

background:rgba(255,255,255,.15);
backdrop-filter:blur(18px);
border-radius:25px;
padding:30px;
text-align:center;
color:#fff;

box-shadow:0 20px 60px rgba(0,0,0,.35);

animation:up 1s;

}

@keyframes up{

from{
opacity:0;
transform:translateY(60px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

font-size:55px;

}

h1{

margin-top:10px;
font-size:32px;

}

p{

margin-top:15px;
line-height:28px;

}

.btn{

display:block;
margin-top:18px;
padding:16px;
border-radius:15px;
text-decoration:none;
font-weight:700;
font-size:18px;
transition:.3s;
position:relative;
overflow:hidden;

}

.review{

background:#fff;
color:#4285F4;

}

.whatsapp{

background:#25D366;
color:#fff;

}

.call{

background:#0d6efd;
color:#fff;

}

.maps{

background:#EA4335;
color:#fff;

}

.btn:hover{

transform:scale(1.05);

}

.floating{

position:fixed;
right:18px;
bottom:18px;

display:flex;
flex-direction:column;
gap:12px;

}

.float{

width:58px;
height:58px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
text-decoration:none;
font-size:28px;
color:#fff;
box-shadow:0 8px 20px rgba(0,0,0,.35);

}

.w{background:#25D366}
.c{background:#0d6efd}
.m{background:#EA4335}

.toggle{

position:fixed;
left:15px;
top:15px;
cursor:pointer;
font-size:28px;

}

.dark{

background:#111!important;

}

.footer{

margin-top:25px;
font-size:14px;

}

canvas{

position:fixed;
inset:0;
pointer-events:none;

}

</style>

</head>

<body>

<div class="loader" id="loader">

✨ Loading...

</div>

<div class="toggle" onclick="mode()">🌙</div>

<canvas id="canvas"></canvas>

<div class="card">

<div class="logo">🌟</div>

<h1>SEEMA DIGITAL</h1>

<p>

Aapka ek ⭐⭐⭐⭐⭐ Review
hamare liye bahut keemti hai.

</p>

<a class="btn review"

onclick="boom()"

href="https://g.page/r/CXrOb5EcYE5UEAI/review?utm_source=gbp&utm_medium=reviews&utm_campaign=qr"

target="_blank">

⭐⭐⭐⭐⭐ Google Review

</a>

<a class="btn whatsapp"

href="https://wa.me/919767610061?text=Namaste%20Seema%20Digital,%20maine%20review%20de%20diya."

target="_blank">

💬 WhatsApp

</a>

<a class="btn call"

href="tel:+919767610061">

📞 Call Now

</a>

<a class="btn maps"

href="https://maps.google.com/?q=Seema%20Digital%20Kannad"

target="_blank">

📍 Open Map

</a>

<div class="footer">

✨ SEEMA DIGITAL ✨

<br><br>

📞 9767610061

<br>

Near Panchayat Samiti Quarter

<br>

Opp. Namokar Super Mart

<br>

Bus Stand Road, Kannad

</div>

</div>

<div class="floating">

<a class="float w"

href="https://wa.me/919767610061">💬</a>

<a class="float c"

href="tel:+919767610061">📞</a>

<a class="float m"

href="https://maps.google.com/?q=Seema%20Digital%20Kannad">📍</a>

</div>

<script>

setTimeout(()=>{

loader.style.opacity=0;
loader.style.visibility="hidden";

},1800)

function mode(){

document.body.classList.toggle("dark")

}

function boom(){

if(navigator.vibrate)

navigator.vibrate([120,60,120])

const c=document.getElementById("canvas")

const x=c.getContext("2d")

c.width=innerWidth

c.height=innerHeight

for(let i=0;i<180;i++){

setTimeout(()=>{

x.fillStyle=`hsl(${Math.random()*360},100%,60%)`

x.beginPath()

x.arc(Math.random()*c.width,Math.random()*c.height,4,0,6.28)

x.fill()

},i*5)

}

setTimeout(()=>{

x.clearRect(0,0,c.width,c.height)

},2500)

}

</script>

</body>
</html>
